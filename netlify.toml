# 全栈 Next.js（API Routes / 服务端鉴权 / Prisma）→ Netlify
#
# 重要：SQLite 不能用于 Netlify Serverless。
# 构建必须用 PostgreSQL schema（prod:build），并在 Netlify 环境变量中配置：
#   DATABASE_URL   = postgresql://...（建议 Neon / Supabase 带连接池的 URL）
#   AUTH_SECRET    = 随机长字符串（openssl rand -base64 48）
#   PUBLIC_BASE_URL= https://你的站点.netlify.app
#   COOKIE_SECURE=true
#   SMS_PROVIDER / SMS_* （登录发短信，必填）
# 首次部署后需对数据库执行一次：npm run prod:db:push && npm run prod:db:seed
# （或在本机指向同一 DATABASE_URL 执行）

[build]
  command = "npm run netlify:build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
